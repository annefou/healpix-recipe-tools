[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healpix-recipe-tools"
version = "0.1.0.dev0"
description = "Shared building blocks for HEALPix recipes: staging, healpix-convert settings, BIOCLIM conventions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Anne Fouilloux", email = "anne.fouilloux@lifewatch.eu" }]
dependencies = ["healpix-convert", "numpy>=2", "rasterio>=1.4", "shapely>=2.1", "xarray>=2025.11", "zarr>=3.1.3"]

[project.urls]
Repository = "https://github.com/annefou/healpix-recipe-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/healpix_recipe_tools"]

[tool.pytest.ini_options]
markers = ["network: reads remote data (run with -m network)"]
addopts = "-m 'not network'"
